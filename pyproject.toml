[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sightmesh-center"
version = "0.1.0"
description = "SightMesh center runtime for global association, 3D state fusion, world modeling, and map queries; currently implements basic map services"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
sightmesh-map = "sightmesh_center.__main__:main"

[tool.setuptools.packages.find]
include = ["sightmesh_center*"]
